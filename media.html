<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Media gallery for our production company">
    <meta name="author" content="Zaid">
    <title>Media Gallery</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/layout.css">

</head>
<body>
    <header class="top">
           <h1>Media Gallery</h1>
    </header>

    <nav class="nav">
    
        <ul>
            <li><a href="index.html">Home</a> | </li>
            <li><a href="about.html">About</a> | </li>
            <li><a href="media.html">Media</a> | </li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>

    <section class="video-showcase">
        <h2>Video Showcase</h2>

        <figure>
            <video controls width="400">
                <source src="media/sample1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <video controls width="400">
                <source src="media/sample2.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </figure>
    </section>
        
        <section class="audio-sample">
            <h2>Audio Sample</h2>
            
            <audio controls>
                <source src="media/sample_audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <p>Listen to our audio production quality.</p>
        </section>
      
        <section class="location">
            <article>
                <h2>Location</h2>
                <iframe 
                    title="Our Location"
                    src="https://www.google.com/maps?q=123+Media+Street&output=embed" 
                    allowfullscreen
                    loading="lazy">
                </iframe>
                <p>Visit our studio at 123 Media Street</p>
            </article>
        </section>

    <section class="client">
        <h2>Client Testimonials</h2>

        <article>
            <figure>
                <img src="images/client1.jpg" alt="Jane Doe portrait">
                <figcaption>
                    "Great feedback and professionalism" — Jane Doe, CEO of Nando's
                </figcaption>
            </figure>

            <figure>
                <img src="images/client2.jpg" alt="John Doe portrait">
                <figcaption>
                    "67 67 67..." — John Doe, CEO of Sasol
                </figcaption>
            </figure>
        </article>
    </section>
        
    </main>
    
    <footer>
         <div class="bottom">
            <p>Email: Zaidakhalwaya6@mediaproduction.com</p>
            <p>Phone: 011-555-0123</p>
         </div>
    </footer>
    

</body>
</html>
