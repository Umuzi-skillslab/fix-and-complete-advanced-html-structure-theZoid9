<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact information for our media production company">
    <meta name="author" content="Zaid">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <header class="top">
        <h1>Contact Us</h1>
    </header>
    <nav class="nav">
        <ul >
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="media.html">Media</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    
    <main class="form-main">


        <form action="#" method="POST">
            <fieldset>
                <legend>Get In Touch</legend>

                <div class="input">
                    <label for="name">Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Your Name"
                        required
                        minlength="1"
                        maxlength="50"
                        pattern="[A-Za-z\s]+"
                        title="Name should only contain letters and spaces"
                    >
                </div>

                <div class="input">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your@email.com"
                        required
                    >
                </div>

                <div class="input">
                    <label for="phone">Phone</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="08212345678"
                        pattern="[0-9]{10,15}"
                        minlength="10"
                        maxlength="15"
                        title="Phone number must be 10 to 15 digits"
                        required
                    >
                </div>

                <div class="gender-input" >
                    <label>Gender</label>
                    <div class="radio-options" >
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>

                <!-- Checkboxes -->
                <div class="checkbox-input">
                    <label >Interests</label>
                    <label><input type="checkbox" name="interest" value="video"> Video</label>
                    <label><input type="checkbox" name="interest" value="audio"> Audio</label>
                    <label><input type="checkbox" name="interest" value="editing"> Editing</label>
                </div>

                <!-- Select -->
                <div class="service-input">
                    <label for="service">Service</label>
                    <select id="service" name="service" required>
                        <option value="">Select a service</option>
                        <option value="video">Video Production</option>
                        <option value="audio">Audio Recording</option>
                        <option value="editing">Editing</option>
                    </select>
                </div>

                <!-- Date input -->
                <div class="input">
                    <label for="date">Preferred Date</label>
                    <input 
                        type="date" 
                        id="date" 
                        name="date"
                        min="2025-01-01"
                        max="2030-12-31"
                        required
                    >
                </div>

                <!-- Number input -->
                <div class="input">
                    <label for="budget">Budget (R)</label>
                    <input 
                        type="number" 
                        id="budget" 
                        name="budget"
                        min="0"
                        max="100000"
                        step="100"
                        required
                    >
                </div>

                <!-- URL input -->
                <div class="input">
                    <label for="website">Website</label>
                    <input 
                        type="url" 
                        id="website" 
                        name="website"
                        placeholder="https://example.com"
                         required
                    >
                </div>

                <!-- Message -->
                <div class="message-input">
                    <label for="message">Message</label>
                    <textarea 
                        id="message" 
                        name="message"
                        minlength="10"
                        maxlength="300"
                        required
                    ></textarea>
                </div>

            </fieldset>

            <button type="submit">Submit</button>
        </form>
    </main>
    
    <footer class="bottom">
            <p>Email: Zaidakhalwaya6@mediaproduction.com</p>
            <p>Phone: 011-555-0123</p>
    </footer>
</body>
</html>
